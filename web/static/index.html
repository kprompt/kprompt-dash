<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kprompt-dash</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">kprompt-dash</p>
        <h1>Cluster</h1>
      </div>
      <p id="ctx" class="meta">connecting…</p>
    </header>

    <section class="controls">
      <label>
        Namespace
        <select id="ns"></select>
      </label>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-kind="deployments">Deployments</button>
        <button type="button" class="tab" data-kind="pods">Pods</button>
      </div>
    </section>

    <div class="layout">
      <main>
        <table>
          <thead id="head"></thead>
          <tbody id="body">
            <tr>
              <td colspan="6">Loading…</td>
            </tr>
          </tbody>
        </table>
      </main>

      <aside id="detail" class="detail" hidden>
        <div class="detail-top">
          <div>
            <p class="eyebrow" id="detail-kind">Detail</p>
            <h2 id="detail-title">—</h2>
          </div>
          <button type="button" id="detail-close" class="ghost">Close</button>
        </div>
        <p id="detail-meta" class="meta"></p>
        <h3>Ask kprompt</h3>
        <div class="handoff">
          <div class="handoff-presets" id="handoff-presets"></div>
          <label class="handoff-label">
            Prompt
            <textarea id="handoff-prompt" rows="2" placeholder='e.g. explain why payment-api is crashing'></textarea>
          </label>
          <div class="handoff-actions">
            <button type="button" id="handoff-copy" class="primary">Copy command</button>
            <span id="handoff-status" class="meta" aria-live="polite"></span>
          </div>
          <pre id="handoff-cmd" class="cmd">—</pre>
        </div>
        <h3>Conditions</h3>
        <ul id="detail-conditions" class="list"></ul>
        <h3>Events</h3>
        <ul id="detail-events" class="list"></ul>
        <h3>Logs <span id="detail-log-pod" class="meta"></span></h3>
        <pre id="detail-logs" class="logs">—</pre>
      </aside>
    </div>

    <footer>
      <p>
        Read-only localhost inventory. Mutate via
        <code>kprompt "…"</code> — not a Lens replacement.
      </p>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
